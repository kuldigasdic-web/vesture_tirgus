<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebAR Pastkarte</title>
    <!-- Stabila dzinēju versiju kombinācija -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #status {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        background: rgba(0, 0, 0, 0.7);
        color: #ffffff;
        font-family: sans-serif;
        font-size: 14px;
        border-radius: 20px;
        z-index: 10000;
        pointer-events: none;
        transition: background 0.3s ease;
      }
    </style>
  </head>
  <body>
    <div id="status">Pavērsiet kameru pret bildi...</div>

    <a-scene 
      mindar-image="imageTargetSrc: tiguslauk1.mind; uiLoading: no; uiScanning: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: false" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Marķieris no tiguslauk.mind -->
      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        <!-- Bilde, kas parādās tieši virs marķiera -->
        <a-image 
          src="tirgus.jpeg" 
          position="0 0 0.05" 
          height="1" 
          width="1">
        </a-image>
      </a-entity>
    </a-scene>

    <script>
      const target = document.querySelector('#ar-target');
      const statusText = document.querySelector('#status');

      target.addEventListener('targetFound', () => {
        statusText.innerText = "✓ Bilde atpazīta!";
        statusText.style.background = "rgba(0, 180, 80, 0.85)";
      });

      target.addEventListener('targetLost', () => {
        statusText.innerText = "Pavērsiet kameru pret bildi...";
        statusText.style.background = "rgba(0, 0, 0, 0.7)";
      });
    </script>
  </body>
</html>
