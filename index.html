<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pastkarte AR</title>
    <!-- Pārbaudītas un stabilas dzinēja versijas -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- AR aina ar tavu marķieri tirguslauk12.mind -->
    <a-scene 
      mindar-image="imageTargetSrc: ./tirguslauk12.mind; uiLoading: yes; uiScanning: yes;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: false" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Pirmais marķieris failā -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Bilde tirgus.jpeg, kas parādās virs marķiera -->
        <a-image 
          src="tirgus.jpeg" 
          position="0 0 0.1" 
          height="1" 
          width="1">
        </a-image>
      </a-entity>
    </a-scene>
  </body>
</html>
