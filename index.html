<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebAR Pastkarte</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      /* Statusa indikators augšā */
      #status {
        position: fixed;
        top: 15px; left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        background: rgba(0, 0, 0, 0.7);
        color: #ff4d4d;
        font-family: sans-serif;
        font-size: 14px;
        border-radius: 20px;
        z-index: 10000;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="status">Pavērsiet kameru pret QR kodu...</div>

    <a-scene 
      mindar-image="imageTargetSrc: tiguslauk.mind; uiLoading: no; uiScanning: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: false" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <!-- Bilde tieši no faila -->
        <a-image 
          src="tirgus.jpeg" 
          position="0 0 0.1" 
          height="1" 
          width="1">
        </a-image>
      </a-entity>
    </a-scene>

    <script>
      const target = document.querySelector('#target');
      const statusText = document.querySelector('#status');

      target.addEventListener('targetFound', () => {
        statusText.innerText = "✓ Atpazīts!";
        statusText.style.color = "#00ff66";
      });

      target.addEventListener('targetLost', () => {
        statusText.innerText = "Pavērsiet kameru pret QR kodu...";
        statusText.style.color = "#ff4d4d";
      });
    </script>
  </body>
</html>
